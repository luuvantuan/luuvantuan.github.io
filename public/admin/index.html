<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quản trị · Lưu Văn Tuấn</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <!-- Sveltia CMS: trang quản trị bài viết. Cấu hình nằm ở admin/config.yml -->
    <script>
      // Khởi động thủ công để đăng ký nút "Video" và "YouTube" trước khi trang quản trị chạy.
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Cố định phiên bản để trang quản trị không tự đổi khi Sveltia ra bản mới. Muốn nâng cấp: đổi số phiên bản rồi thử lại. -->
    <script src="https://unpkg.com/@sveltia/cms@5.0.2/dist/sveltia-cms.js"></script>
    <script>
      const MB = 1024 * 1024;
      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

      // Nút "Video": tải file mp4 từ máy lên public/videos/ rồi chèn vào bài.
      // Ra đúng dạng blog đang dùng: <video src="/videos/ten.mp4" controls playsinline></video>
      CMS.registerEditorComponent({
        id: "video",
        label: "Video nhỏ (tải lên, dưới 50MB)",
        icon: "videocam",
        fields: [
          {
            name: "src",
            label: "File video (mp4, dưới 50MB)",
            hint: "Video lớn hơn 50MB: đăng lên YouTube (có thể để chế độ Không công khai) rồi dùng nút YouTube.",
            widget: "file",
            media_folder: "/public/videos",
            public_folder: "/videos",
            accept: "video/mp4,video/webm",
            max_file_size: 50 * MB,
            choose_url: false,
          },
        ],
        pattern: /^<video src="([^"]+)" controls playsinline><\/video>$/,
        fromBlock: (match) => ({ src: match[1] }),
        toBlock: ({ src }) => `<video src="${esc(src)}" controls playsinline></video>`,
        toPreview: ({ src }) => `<video src="${esc(src)}" controls playsinline style="max-width:100%"></video>`,
      });

      // Nút "YouTube": dán link YouTube (video dài, file lớn), web sẽ nhẹ hơn.
      const youtubeId = (input) => {
        const s = String(input ?? "").trim();
        const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
        return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : "";
      };
      // Video thường (ngang 16:9) và Shorts (dọc 9:16) được chèn hơi khác nhau.
      // referrerpolicy + allow: YouTube cần các thuộc tính này, thiếu sẽ báo "Lỗi 153 / lỗi phát video".
      const isShort = (input) => /\/shorts\//.test(String(input ?? ""));
      const YT_ATTRS =
        'title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen';
      const ytIframe = (id, short) =>
        `<iframe${short ? ' class="short"' : ""} src="https://www.youtube-nocookie.com/embed/${id}" ${YT_ATTRS}></iframe>`;
      CMS.registerEditorComponent({
        id: "youtube",
        label: "YouTube",
        icon: "smart_display",
        fields: [
          {
            name: "url",
            label: "Link YouTube",
            widget: "string",
            hint: "Dán link video hoặc Shorts, ví dụ https://youtu.be/abc123xyz00. Không giới hạn dung lượng: đăng video lên YouTube trước (để Công khai hoặc Không công khai, KHÔNG để Riêng tư), rồi dán link vào đây.",
          },
        ],
        // Nhận cả dạng cũ (chỉ có title + allowfullscreen) lẫn dạng mới.
        pattern: /^<iframe( class="short")? src="https:\/\/www\.youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{11})"[^>]*><\/iframe>$/,
        fromBlock: (match) => ({ url: match[1] ? `https://youtube.com/shorts/${match[2]}` : `https://youtu.be/${match[2]}` }),
        toBlock: ({ url }) => ytIframe(youtubeId(url), isShort(url)),
        // Khung xem trước trong admin: hiện ảnh bìa thay vì trình phát (trình phát hay lỗi trong khung xem trước).
        toPreview: ({ url }) => {
          const id = youtubeId(url);
          if (!id) return `<p style="color:#b00">Link YouTube chưa đúng.</p>`;
          const box = isShort(url) ? "max-width:240px;aspect-ratio:9/16" : "aspect-ratio:16/9";
          return `<a href="https://youtu.be/${id}" target="_blank" rel="noopener" style="display:block;position:relative;width:100%;${box};background:#000 url(https://i.ytimg.com/vi/${id}/hqdefault.jpg) center/cover;border-radius:6px"><span style="position:absolute;inset:auto 0 0 0;padding:8px 12px;background:rgba(0,0,0,.6);color:#fff;font:14px sans-serif">▶ Video YouTube (xem thử trên YouTube)</span></a>`;
        },
      });

      CMS.init();
    </script>
  </body>
</html>
