<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quản trị · Lưu Văn Tuấn</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <!-- Sveltia CMS: trang quản trị bài viết. Cấu hình nằm ở admin/config.yml -->
    <script>
      // Khởi động thủ công để đăng ký nút "Video" và "YouTube" trước khi trang quản trị chạy.
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Cố định phiên bản để trang quản trị không tự đổi khi Sveltia ra bản mới. Muốn nâng cấp: đổi số phiên bản rồi thử lại. -->
    <script src="https://unpkg.com/@sveltia/cms@5.0.2/dist/sveltia-cms.js"></script>
    <script>
      const MB = 1024 * 1024;
      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

      // Nút "Video": tải file mp4 từ máy lên public/videos/ rồi chèn vào bài.
      // Ra đúng dạng blog đang dùng: <video src="/videos/ten.mp4" controls playsinline></video>
      CMS.registerEditorComponent({
        id: "video",
        label: "Video nhỏ (tải lên, dưới 50MB)",
        icon: "videocam",
        fields: [
          {
            name: "src",
            label: "File video (mp4, dưới 50MB)",
            hint: "Video lớn hơn 50MB: đăng lên YouTube (có thể để chế độ Không công khai) rồi dùng nút YouTube.",
            widget: "file",
            media_folder: "/public/videos",
            public_folder: "/videos",
            accept: "video/mp4,video/webm",
            max_file_size: 50 * MB,
            choose_url: false,
          },
        ],
        pattern: /^<video src="([^"]+)" controls playsinline><\/video>$/,
        fromBlock: (match) => ({ src: match[1] }),
        toBlock: ({ src }) => `<video src="${esc(src)}" controls playsinline></video>`,
        toPreview: ({ src }) => `<video src="${esc(src)}" controls playsinline style="max-width:100%"></video>`,
      });

      // Nút "YouTube": dán link YouTube (video dài, file lớn), web sẽ nhẹ hơn.
      const youtubeId = (input) => {
        const s = String(input ?? "").trim();
        const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
        return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : "";
      };
      // Video thường (ngang 16:9) và Shorts (dọc 9:16) được chèn hơi khác nhau.
      const isShort = (input) => /\/shorts\//.test(String(input ?? ""));
      const ytIframe = (id, short) =>
        `<iframe${short ? ' class="short"' : ""} src="https://www.youtube-nocookie.com/embed/${id}" title="Video" allowfullscreen></iframe>`;
      CMS.registerEditorComponent({
        id: "youtube",
        label: "YouTube",
        icon: "smart_display",
        fields: [
          {
            name: "url",
            label: "Link YouTube",
            widget: "string",
            hint: "Dán link video hoặc Shorts, ví dụ https://youtu.be/abc123xyz00. Không giới hạn dung lượng: đăng video lên YouTube trước (có thể để Không công khai), rồi dán link vào đây.",
          },
        ],
        pattern: /^<iframe( class="short")? src="https:\/\/www\.youtube-nocookie\.com\/embed\/([A-Za-z0-9_-]{11})" title="Video" allowfullscreen><\/iframe>$/,
        fromBlock: (match) => ({ url: match[1] ? `https://youtube.com/shorts/${match[2]}` : `https://youtu.be/${match[2]}` }),
        toBlock: ({ url }) => ytIframe(youtubeId(url), isShort(url)),
        toPreview: ({ url }) =>
          `<iframe src="https://www.youtube-nocookie.com/embed/${youtubeId(url)}" style="width:100%;${isShort(url) ? "max-width:360px;aspect-ratio:9/16" : "aspect-ratio:16/9"};border:0" allowfullscreen></iframe>`,
      });

      CMS.init();
    </script>
  </body>
</html>
