# Cấu hình trang quản trị https://luuvantuan.com/admin/
# Mỗi lần bấm "Lưu" (Save) trong trang quản trị = 1 commit lên GitHub,
# GitHub Actions sẽ tự dựng lại web sau khoảng 1–2 phút.

backend:
  name: github
  repo: luuvantuan/luuvantuan.github.io
  branch: main
  commit_messages:
    create: "Bài mới: {{slug}}"
    update: "Sửa bài: {{slug}}"
    delete: "Xóa bài: {{slug}}"
    uploadMedia: "Tải ảnh: {{path}}"
    deleteMedia: "Xóa ảnh: {{path}}"

# Ảnh tải lên được lưu vào public/images/ và hiện trên web ở /images/...
media_folder: public/images
public_folder: /images

# Đường link bài viết: bỏ dấu tiếng Việt, chỉ dùng chữ thường không dấu.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Bài viết
    label_singular: bài viết
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Bài nháp, field: draft, pattern: true }
    fields:
      - { label: Tiêu đề, name: title, widget: string }
      - label: Mô tả ngắn
        name: description
        widget: text
        required: false
        hint: "1–2 câu, hiện dưới tiêu đề ở trang danh sách và khi chia sẻ link."
      - label: Ngày đăng
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        default: "{{now}}"
      # Danh sách này phải giống hệt TOPICS trong src/site.ts.
      # Thêm/đổi chủ đề thì sửa cả hai nơi, nếu không web sẽ build lỗi.
      - label: Chủ đề
        name: tags
        widget: select
        multiple: true
        min: 1
        options:
          - Học ngoại ngữ
          - Kinh doanh
          - Trở thành bác sĩ Đông y
          - Rèn luyện cơ thể
      - label: Bản nháp
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "Bật lên thì bài được lưu nhưng KHÔNG hiện trên web."
      - { label: Nội dung, name: body, widget: markdown }
